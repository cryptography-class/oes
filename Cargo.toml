[package]
name = "oes"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[features]
default = ["interleave", "aes-ni", "vaes", "pclmulqdq"]
# Experimental: DES encrypts and decrypts four independent blocks together in
# `encrypt_blocks` and `decrypt_blocks`. Interleaving isn't part of FIPS 46-3, and
# the output is the same with or without it.
interleave = []
# AES runs on the processor's AES instructions on x86 and x86-64 when they are
# available. The output is the same with or without it.
aes-ni = []
# On x86-64, whole groups of 16 AES blocks run on the processor's 256-bit AES
# instructions when they are available, two blocks per instruction. The output is
# the same with or without it.
vaes = ["aes-ni"]
# GHASH runs on the processor's carry-less multiply instruction on x86 and x86-64
# when it is available. The output is the same with or without it.
pclmulqdq = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.2"
# Decodes and encodes PNG and BMP for the pixel encryption demo.
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
rayon = "1.12"

# Used only by benchmarks and the library comparison tests, never by the
# implementation: RustCrypto is the reference implementation that DES, AES, ECB,
# CBC, CTR and GCM are checked and timed against.
[dev-dependencies]
aes = "0.9"
aes-gcm = "0.11"
cbc = "0.2"
criterion = "0.8"
ctr = "0.10"
des = "0.9"
ecb = "0.2"

# Turn off the built-in test harness under `cargo bench`, which would reject
# Criterion's flags such as `--save-baseline`.
[lib]
bench = false

[[bin]]
name = "oes"
path = "src/main.rs"
bench = false

[[bench]]
name = "aes"
harness = false

[[bench]]
name = "des"
harness = false

[[bench]]
name = "stream"
harness = false

# Suggestions that Rust 1.89 makes available: `as_chunks` in place of `chunks_exact`
# with a constant size, and let chains in place of nested `if let`. The code doesn't
# use them yet.
[lints.clippy]
chunks_exact_to_as_chunks = "allow"
collapsible_if = "allow"
