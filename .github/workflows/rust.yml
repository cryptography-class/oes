name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with: 
          toolchain: "1.99.1"
          components: clippy
          
      - name: Run tests
        run: cargo test --locked --verbose
      
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests without interleaving
        run: cargo test --locked --verbose --no-default-features

      - name: Run clippy without interleaving
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
